name: Remove temporary CI diagnostics

on:
  push:
    branches: [agent/weekly-warzone-modifiers]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostics-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-warzone-modifiers
          fetch-depth: 0
      - name: Remove temporary diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-diagnostics
          rm -f .github/workflows/remove-ci-diagnostics.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove temporary CI diagnostics [diagnostics-clean]'
          git push origin HEAD:agent/weekly-warzone-modifiers
