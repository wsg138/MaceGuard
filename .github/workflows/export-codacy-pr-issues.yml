name: Export Codacy PR Issues

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download Codacy PR issue details
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/MaceGuard/pull-requests/14/issues'
          curl --fail --silent --show-error --location --header 'Accept: application/json' "$base?limit=1000" --output issues-default.json
          curl --fail --silent --show-error --location --header 'Accept: application/json' "$base?limit=1000&onlyPotential=false&status=new" --output issues-new-nonpotential.json
          curl --fail --silent --show-error --location --header 'Accept: application/json' "$base?limit=1000&onlyPotential=true&status=new" --output issues-new-potential.json
          curl --fail --silent --show-error --location --header 'Accept: application/json' "$base?limit=1000&status=new" --output issues-new.json
      - name: Upload issue details
        uses: actions/upload-artifact@v4
        with:
          name: codacy-pr-issues
          path: issues-*.json
          if-no-files-found: error
          retention-days: 1
