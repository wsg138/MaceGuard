name: Export Codacy PR Issues

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download Codacy PR issue details
        run: >-
          curl --fail --silent --show-error --location
          --header 'Accept: application/json'
          'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/MaceGuard/pull-requests/14/issues?limit=1000&onlyPotential=false&status=new'
          --output codacy-pr-issues.json
      - name: Archive repository source
        run: git archive --format=zip --output=maceguard-source.zip HEAD
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: codacy-pr-diagnostics
          path: |
            codacy-pr-issues.json
            maceguard-source.zip
          if-no-files-found: error
          retention-days: 1
