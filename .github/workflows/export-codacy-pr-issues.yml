name: Export Codacy PR Issues

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply staged Codacy cleanup
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/codacy-fix-bundle.part*)
          if (( ${#parts[@]} == 0 )); then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat "${parts[@]}" | base64 --decode > /tmp/codacy-fix-bundle.tar.gz
          echo "56444a62e0dfaf57509181a0122324777da65f09ebb6b6bbf31c949f20b203ea  /tmp/codacy-fix-bundle.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/codacy-fix-bundle.tar.gz -C .
          rm "${parts[@]}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Resolve Codacy findings"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Download Codacy PR issue details
        if: steps.apply.outputs.applied != 'true'
        run: >-
          curl --fail --silent --show-error --location
          --header 'Accept: application/json'
          'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/MaceGuard/pull-requests/14/issues?limit=1000&onlyPotential=false&status=new'
          --output codacy-pr-issues.json

      - name: Archive repository source
        if: steps.apply.outputs.applied != 'true'
        run: git archive --format=zip --output=maceguard-source.zip HEAD

      - name: Upload diagnostics
        if: steps.apply.outputs.applied != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codacy-pr-diagnostics
          path: |
            codacy-pr-issues.json
            maceguard-source.zip
          if-no-files-found: error
          retention-days: 1
