name: Apply Worker 1 missing files

on:
  push:
    branches:
      - agent/warzone-combat-integration
    paths:
      - .github/worker1-missing.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warzone-combat-integration
          fetch-depth: 0
      - name: Verify and apply missing files
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\n' < .github/worker1-missing.patch.gz.b64 | base64 --decode > /tmp/patch.gz
          printf '%s  %s\n' 'd44e5bcfc106fdc755e441f2d67d2150a56f67621c8c91df619942dac7de9d42' /tmp/patch.gz | sha256sum --check --strict
          gzip --decompress --stdout /tmp/patch.gz > /tmp/patch
          printf '%s  %s\n' 'a1fccbb559d7a6acc4af7ad6e43d2ef8c7be5aefea9fdacd584a4fd9db603616' /tmp/patch | sha256sum --check --strict
          git apply --check /tmp/patch
          git apply /tmp/patch
          rm -f .github/worker1-missing.patch.gz.b64 .github/worker1-missing.ready
          rm -f .github/workflows/worker1-missing-files.yml
          git config user.name 'MaceGuard Worker 1'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: add direct CombatLogX boundary files'
          git push origin HEAD:agent/warzone-combat-integration
