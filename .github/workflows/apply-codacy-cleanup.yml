name: Apply Codacy cleanup

on:
  push:
    branches:
      - agent/expanded-warzone-rotations

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add one-shot Codacy cleanup workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/expanded-warzone-rotations
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply and verify cleanup
        env:
          PATCH_1: 
          PATCH_2: 
          PATCH_3: 
          PATCH_4: 
          PATCH_5: 3Qy2tdUae9UmVc1efpK1masRuWrmcpH9HnhqkiTAUbwgXBBfATP9F+VutJze9wAA
        run: |
          printf '%s' "$PATCH_1$PATCH_2$PATCH_3$PATCH_4$PATCH_5" | base64 --decode | gzip --decompress > /tmp/codacy-cleanup.patch
          echo '43da7b77dab3ca8326136887a35cda2de0d019e81d963e456e8951b802dcec05  /tmp/codacy-cleanup.patch' | sha256sum --check
          git apply --check /tmp/codacy-cleanup.patch
          git apply /tmp/codacy-cleanup.patch
          ./mvnw -B clean verify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/lincoln/maceguard/storage/TemporaryBlockRepository.java
          git add src/main/java/com/lincoln/maceguard/temporary/TemporaryBlockService.java
          git add src/test/java/com/lincoln/maceguard/temporary/TemporaryBlockEmergencyRecoveryTest.java
          git add src/test/java/com/lincoln/maceguard/temporary/TemporaryBlockFailurePathTest.java
          git add src/test/java/com/lincoln/maceguard/temporary/TemporaryBlockServiceTest.java
          git add src/test/java/com/lincoln/maceguard/warzone/integration/WarzoneModifierPlaceholderTest.java
          git commit -m 'Resolve current Codacy findings'
          git push origin HEAD:agent/expanded-warzone-rotations
