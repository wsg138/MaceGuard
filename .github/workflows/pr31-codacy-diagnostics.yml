name: PR 31 Codacy diagnostics

on:
  push:
    branches:
      - agent/fix-warzone-schedule-detail-navigation

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and persist Codacy PR findings
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/MaceGuard/pull-requests/31/issues'
          mkdir -p .agent
          curl --fail-with-body --silent --show-error "$url" > .agent/pr31-codacy-issues.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.agent/pr31-codacy-issues.json')
          data = json.loads(path.read_text())
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + '\n')
          PY
          rm .github/workflows/pr31-codacy-diagnostics.yml

      - name: Commit diagnostics snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agent/pr31-codacy-issues.json .github/workflows/pr31-codacy-diagnostics.yml
          git commit -m 'chore: capture PR 31 Codacy findings'
          git push origin HEAD:agent/fix-warzone-schedule-detail-navigation
