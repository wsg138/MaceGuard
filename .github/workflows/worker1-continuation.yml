name: Apply Worker 1 continuation

on:
  push:
    branches:
      - agent/warzone-combat-integration
    paths:
      - .github/worker1.ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/warzone-combat-integration
          fetch-depth: 0
      - name: Verify and apply the continuation patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/worker1.patch.gz.b64.part* | tr -d '\n' | base64 --decode > /tmp/worker1.patch.gz
          printf '%s  %s\n' '6cd1a5c84e6b389d1644f6f0a61eed5e2d436358611561404f3c94d51404b373' '/tmp/worker1.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/worker1.patch.gz > /tmp/worker1.patch
          printf '%s  %s\n' '1ae78b95e7d2babf0a62523d406aa069c2347de9632ed1165589f63f34c96c63' '/tmp/worker1.patch' | sha256sum --check --strict
          git apply --check /tmp/worker1.patch
          git apply /tmp/worker1.patch
          rm -f .github/worker1.patch.gz.b64.part* .github/worker1.ready
          rm -f .github/workflows/worker1-continuation.yml
          git config user.name 'MaceGuard Worker 1'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: finish direct CombatLogX integration'
          git push origin HEAD:agent/warzone-combat-integration
