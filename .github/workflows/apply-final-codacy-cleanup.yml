name: Apply final Codacy cleanup

on:
  push:
    branches:
      - agent/expanded-warzone-rotations

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply final Codacy cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/expanded-warzone-rotations
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply, verify, and remove temporary workflows
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > /tmp/final-codacy-fix.patch
          echo '289d4121b9474a33aac66f825c48815ad00dd2d1a1e3d447636ea2475eda8a85  /tmp/final-codacy-fix.patch' | sha256sum --check
          git apply --check /tmp/final-codacy-fix.patch
          git apply /tmp/final-codacy-fix.patch
          git show origin/main:.github/workflows/build.yml > .github/workflows/build.yml
          git rm .github/workflows/codacy-final-export.yml
          git rm .github/workflows/apply-final-codacy-cleanup.yml
          ./mvnw -B clean verify
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build.yml
          git add src/main/java/com/lincoln/maceguard/temporary/TemporaryBlockService.java
          git add src/test/java/com/lincoln/maceguard/temporary/TemporaryBlockEmergencyRecoveryTest.java
          git add src/test/java/com/lincoln/maceguard/temporary/TemporaryBlockServiceTest.java
          git commit -m 'Resolve final Codacy findings'
          git push origin HEAD:agent/expanded-warzone-rotations
