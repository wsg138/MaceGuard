name: Apply verified implementation bundle

on:
  push:
    branches: [agent/weekly-warzone-modifiers]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[bundle-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-warzone-modifiers
          fetch-depth: 0
      - name: Verify and apply recovered implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .maceguard-complete/part-* > /tmp/maceguard.bundle.b64
          test "$(sha256sum /tmp/maceguard.bundle.b64 | awk '{print $1}')" = "30711be9057d07d91173c2104c3c200fdc8ccd5e4295782881944fadb817e599"
          base64 --decode /tmp/maceguard.bundle.b64 > /tmp/maceguard.bundle.tar.gz
          gzip -t /tmp/maceguard.bundle.tar.gz
          mkdir -p /tmp/maceguard-unpacked
          tar -xzf /tmp/maceguard.bundle.tar.gz -C /tmp/maceguard-unpacked
          rsync -a --exclude '.git' /tmp/maceguard-unpacked/ ./
          rm -rf .maceguard-bundle .maceguard-complete .github/workflows/apply-interrupted-bundle.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Implement weekly warzone modifiers [bundle-applied]'
          git push origin HEAD:agent/weekly-warzone-modifiers
