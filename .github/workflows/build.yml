name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warzone-kits-schedules-guis
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and verify audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .codex-final/part00 \
            .codex-final/part01 \
            .codex-final/part02 \
            .codex-final/part03 \
            .codex-final/part04 \
            .codex-final/part05 \
            .codex-final/rest00 \
            .codex-final/rest01 \
            .codex-final/rest02 \
            .codex-final/rest03 \
            .codex-final/rest04 \
            > /tmp/maceguard-final.b64
          echo 'ebd80089a7b5e5550cfe6be607f60fbab3c4b39ad2b208ef1ee17443c9cf7743  /tmp/maceguard-final.b64' | sha256sum -c -
          base64 --decode /tmp/maceguard-final.b64 > /tmp/maceguard-final.patch.gz
          echo '12149380bae88f7d4a0f04a816036a6273604bb4267ad55e80a52311e366cc49  /tmp/maceguard-final.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/maceguard-final.patch.gz > /tmp/maceguard-final.patch
          echo 'ac37340dbc6bc82e57680210d8bdd7071a1077b01b0e6ac34433aba7bcd072e3  /tmp/maceguard-final.patch' | sha256sum -c -
          git apply --check --exclude=.github/workflows/build.yml /tmp/maceguard-final.patch
          git apply --exclude=.github/workflows/build.yml /tmp/maceguard-final.patch
          cat > .github/workflows/build.yml <<'YAML'
          name: Build
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          permissions:
            contents: read
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: temurin
                    java-version: '21'
                - name: Verify and package
                  run: ./mvnw -B clean verify
                - uses: actions/upload-artifact@v4
                  with:
                    name: MaceGuard
                    path: target/MaceGuard.jar
                    if-no-files-found: error
                    retention-days: 14

            publish-latest:
              if: github.event_name == 'push'
              needs: build
              runs-on: ubuntu-latest
              permissions:
                contents: write
              steps:
                - uses: actions/download-artifact@v4
                  with:
                    name: MaceGuard
                    path: dist
                - name: Publish latest automated build
                  env:
                    GH_TOKEN: ${{ github.token }}
                  run: |
                    if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                      gh release upload latest dist/MaceGuard.jar --clobber --repo "$GITHUB_REPOSITORY"
                      gh release edit latest --title "Latest automated build" --prerelease --target "$GITHUB_SHA" --notes "Automatically updated from main." --repo "$GITHUB_REPOSITORY"
                    else
                      gh release create latest dist/MaceGuard.jar --title "Latest automated build" --prerelease --target "$GITHUB_SHA" --notes "Automatically updated from main." --repo "$GITHUB_REPOSITORY"
                    fi
          YAML
          git rm -r --ignore-unmatch \
            .codex-transfer \
            .codex-final \
            .codex-download-link.md \
            .github/workflows/apply-final.yml
          git diff --check

      - name: Verify and package exact replacement tree
        run: ./mvnw -B clean verify

      - name: Inspect packaged plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f target/MaceGuard.jar
          unzip -p target/MaceGuard.jar plugin.yml | grep -F "version: 6.0.0"
          unzip -l target/MaceGuard.jar | grep -F "warzone.yml"
          unzip -l target/MaceGuard.jar | grep -F "warzone-messages.yml"
          if unzip -l target/MaceGuard.jar | grep -Eq '(^|/)(org/junit|org/mockito|com/sk89q|me/clip/placeholderapi)/'; then
            echo 'Unexpected test or provided dependency bundled in JAR.' >&2
            exit 1
          fi

      - name: Upload audited JAR
        uses: actions/upload-artifact@v4
        with:
          name: MaceGuard-audited
          path: target/MaceGuard.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish clean implementation commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Warzone kits schedules overrides and spear controls'
          git push origin HEAD:agent/warzone-kits-schedules-guis
