name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and package
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B clean verify 2>&1 | tee clean-verify.log
      - name: Upload failed verification transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaceGuard-failed-verification
          path: |
            clean-verify.log
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Resolve dependency tree
        shell: bash
        run: |
          set -o pipefail
          ./mvnw -B dependency:tree 2>&1 | tee target/dependency-tree.txt
      - name: Record reproducibility and inspect JAR
        shell: bash
        run: |
          set -o pipefail
          bash -euxo pipefail <<'SCRIPT' 2>&1 | tee jar-inspection.log
          JAR=target/MaceGuard.jar
          test -f "$JAR"
          {
            echo "source_commit=$(git rev-parse HEAD)"
            java -version 2>&1
            ./mvnw -version
            echo "main_source_count=$(find src/main/java -name '*.java' -type f | wc -l)"
            echo "test_source_count=$(find src/test/java -name '*.java' -type f | wc -l)"
            echo "jar_size_bytes=$(stat -c%s "$JAR")"
            sha256sum "$JAR"

            while IFS='|' read -r expected dependency; do
              if [[ ! -f "$dependency" ]]; then
                echo "Expected immutable artifact not found at $dependency"
                find "$HOME/.m2/repository" -type f -name 'paper-api-*.jar' -print | sort
                exit 1
              fi
              actual=$(sha256sum "$dependency" | awk '{print $1}')
              if [[ "$actual" != "$expected" ]]; then
                echo "Dependency hash mismatch for $dependency: expected $expected, got $actual"
                exit 1
              fi
              printf '%s  %s\n' "$actual" "$dependency"
            done <<DEPENDENCIES
          7ec623c368f72a6a7326a2d903397a537b0c4cad86d6f63f65dc77606a29809b|$HOME/.m2/repository/io/papermc/paper/paper-api/1.21.11-R0.1-SNAPSHOT/paper-api-1.21.11-R0.1-20251209.165129-1.jar
          DEPENDENCIES

            echo "plugin_yml_count=$(jar tf "$JAR" | grep -c '^plugin.yml$')"
            unzip -p "$JAR" plugin.yml | sed -n '1,20p'
          } | tee target/verification.txt
          test "$(jar tf "$JAR" | grep -c '^plugin.yml$')" -eq 1
          unzip -p "$JAR" plugin.yml | grep -q '^version: 6.1.4$'
          unzip -p "$JAR" plugin.yml | grep -q '^main: com.lincoln.maceguard.MaceGuardPlugin$'
          unzip -p "$JAR" plugin.yml | grep -q "^api-version: '1.21'$"
          unzip -p "$JAR" warzone.yml | grep -q '^config-version: 7$'
          ! jar tf "$JAR" | grep -Eq '^(com/github/sirblobman|io/papermc|org/bukkit|com/sk89q/worldguard|com/sk89q/worldedit|me/clip/placeholderapi|org/geysermc|org/floodgate|net/essentialsx|com/earth2me/essentials)/'
          ! jar tf "$JAR" | grep -Eq '(^|/)(test|tests)/|Test.class$|\.java$|^handoffs/'
          ! jar tf "$JAR" | grep -Eq 'CombatLogXBridge|ReflectiveCombat'
          ! grep -R -n '^import com\.github\.sirblobman' src/main/java src/test/java
          ! grep -n '<groupId>com.github.sirblobman' pom.xml
          grep -q '<version>6.1.4</version>' pom.xml
          cat target/dependency-tree.txt >> target/verification.txt
          SCRIPT
      - name: Upload failed JAR inspection transcript
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MaceGuard-failed-jar-inspection
          path: |
            clean-verify.log
            jar-inspection.log
            target/verification.txt
            target/dependency-tree.txt
            target/MaceGuard.jar
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: MaceGuard
          path: |
            clean-verify.log
            jar-inspection.log
            target/MaceGuard.jar
            target/verification.txt
            target/dependency-tree.txt
            target/surefire-reports/*.txt
            target/surefire-reports/*.xml
          if-no-files-found: error
          retention-days: 14

  publish-latest:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MaceGuard
          path: dist
      - name: Publish latest automated build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=dist/target/MaceGuard.jar
          test -f "$JAR"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "$JAR" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --title "Latest automated build" --prerelease --target "$GITHUB_SHA" --notes "Automatically updated from main." --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest "$JAR" --title "Latest automated build" --prerelease --target "$GITHUB_SHA" --notes "Automatically updated from main." --repo "$GITHUB_REPOSITORY"
          fi
