name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warzone-kits-schedules-guis
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and verify audited source patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .codex-final/part00 \
            .codex-final/part01 \
            .codex-final/part02 \
            .codex-final/part03 \
            .codex-final/part04 \
            .codex-final/part05 \
            .codex-final/rest00 \
            .codex-final/rest01 \
            .codex-final/rest02 \
            .codex-final/rest03 \
            .codex-final/rest04 \
            > /tmp/maceguard-final.b64
          echo '18226b6189616d1fbaa4bb6fa61c054867d62b00227c13eeb9b154121fac9e2e  /tmp/maceguard-final.b64' | sha256sum -c -
          base64 --decode /tmp/maceguard-final.b64 > /tmp/maceguard-final.patch.gz
          echo '12da53906335a0490493add1c9e3e4d34f1fbe8ef7f1d5d4b6b81c125b4a6a9d  /tmp/maceguard-final.patch.gz' | sha256sum -c -
          gzip --decompress --stdout /tmp/maceguard-final.patch.gz > /tmp/maceguard-final.patch
          echo 'ac37340dbc6bc82e57680210d8bdd7071a1077b01b0e6ac34433aba7bcd072e3  /tmp/maceguard-final.patch' | sha256sum -c -
          git apply --check --exclude=.github/workflows/build.yml /tmp/maceguard-final.patch
          git apply --exclude=.github/workflows/build.yml /tmp/maceguard-final.patch
          git rm -r --ignore-unmatch \
            .codex-transfer \
            .codex-final \
            .codex-download-link.md
          git diff --check

      - name: Verify and package exact source tree
        run: ./mvnw -B clean verify

      - name: Inspect packaged plugin metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f target/MaceGuard.jar
          unzip -p target/MaceGuard.jar plugin.yml | grep -F "version: 6.0.0"
          unzip -l target/MaceGuard.jar | grep -F "warzone.yml"
          unzip -l target/MaceGuard.jar | grep -F "warzone-messages.yml"
          if unzip -l target/MaceGuard.jar | grep -Eq '(^|/)(org/junit|org/mockito|com/sk89q|me/clip/placeholderapi)/'; then
            echo 'Unexpected test or provided dependency bundled in JAR.' >&2
            exit 1
          fi

      - name: Upload audited JAR
        uses: actions/upload-artifact@v4
        with:
          name: MaceGuard-audited
          path: target/MaceGuard.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Warzone kits schedules overrides and spear controls'
          git push origin HEAD:agent/warzone-kits-schedules-guis
