name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warzone-kits-schedules-guis
      - name: Verify publication segments individually
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/segments.sha256 <<'SUMS'
          3507ed3c6a722e39ec9c8b134f2e8ef515ec098f0fc942ce813878fc5762e0a7  .codex-final/part00
          0725966c8f76e69a457a5b68451c62d474faab6e0c26ccc945af0696c2712f0f  .codex-final/part01
          124f9e870b54563721f30ae64ce1fd96d5e6806bc658396eca7ce764ca22fb7c  .codex-final/part02
          a8e9d9db8eac5a98891a9fcc985fe799e328c3d5fff63a2e06540447d851b791  .codex-final/part03
          d7cd9a234bdd3c2daee7bb698aca1eee22ab7b92d9c4c1bf67d247207f17cc18  .codex-final/part04
          c93e0e98d40e4b51ab2a550ae8a620d446336bc260a13a2fe1994ebc050cb154  .codex-final/part05
          e7934c830530d7cb1d8dac305c9a9cdf8ff670b0bcc5a8f2336867bd74d16f6b  .codex-final/rest00
          2f56ad837b29d5b319158a520ec599d9c74130f4749bc6e7e4b3f824361bdead  .codex-final/rest01
          1e7205771cb5610d010f0314bcb7594359e3668646c387e5e4f3620dc90a64f6  .codex-final/rest02
          9b3081607a988fd5b6e2b9263ac6a0fbfbdcaa7f5f2378edde3a115b8472c689  .codex-final/rest03
          507a34967dd5a546c888403a211edf34a148ec2f68a80262d8e27c86ab40f799  .codex-final/rest04
          SUMS
          sha256sum --check /tmp/segments.sha256
