name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify exact source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply exact analyzer cleanup and restore workflows
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def block(*lines: str) -> str:
              return '\n'.join(lines) + '\n'

          manager = Path('src/main/java/com/lincoln/maceguard/warzone/gui/WarzoneGuiManager.java')
          text = manager.read_text()
          old = block(
              '    private void scheduleClick(Player player, Session session, String type, String value) {',
              '        if ("back-main".equals(type)) {',
              '            openMain(player);',
              '            return;',
              '        }',
              '        if ("back-schedule".equals(type)',
              '                || "view-schedule".equals(type)',
              '                || "page".equals(type)) {',
              '            openSchedule(player, session, Integer.parseInt(value));',
              '            return;',
              '        }',
              '        if ("schedule-entry".equals(type)) {',
              '            openScheduleDetail(player, session, Integer.parseInt(value),',
              '                    ScheduleDetailOrigin.SCHEDULE, session.page);',
              '        }',
              '    }')
          new = block(
              '    private void scheduleClick(Player player, Session session, String type, String value) {',
              '        if (type == null) {',
              '            return;',
              '        }',
              '        switch (type) {',
              '            case "back-main" -> openMain(player);',
              '            case "back-schedule", "view-schedule", "page" ->',
              '                    openSchedule(player, session, Integer.parseInt(value));',
              '            case "schedule-entry" -> openScheduleDetail(player, session, Integer.parseInt(value),',
              '                    ScheduleDetailOrigin.SCHEDULE, session.page);',
              '            default -> { }',
              '        }',
              '    }')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one scheduleClick block, found {count}')
          manager.write_text(text.replace(old, new, 1))
          PY

          git show origin/main:.github/workflows/build.yml > .github/workflows/build.yml
          git show origin/main:.github/workflows/codacy.yml > .github/workflows/codacy.yml

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'case "back-schedule", "view-schedule", "page"' src/main/java/com/lincoln/maceguard/warzone/gui/WarzoneGuiManager.java
          test "$(git show origin/main:.github/workflows/build.yml | sha256sum | awk '{print $1}')" = "$(sha256sum .github/workflows/build.yml | awk '{print $1}')"
          test "$(git show origin/main:.github/workflows/codacy.yml | sha256sum | awk '{print $1}')" = "$(sha256sum .github/workflows/codacy.yml | awk '{print $1}')"

      - name: Run Maven verification
        run: ./mvnw -B clean verify

      - name: Commit verified analyzer cleanup
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main/java/com/lincoln/maceguard/warzone/gui/WarzoneGuiManager.java \
                  .github/workflows/build.yml \
                  .github/workflows/codacy.yml
          git commit -m 'Fix schedule dispatch analyzer findings'
          git push origin HEAD:"$HEAD_BRANCH"
