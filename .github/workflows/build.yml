name: Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and package
        run: ./mvnw -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: MaceGuard
          path: target/MaceGuard.jar
          if-no-files-found: error
          retention-days: 14
      - name: Export final Codacy findings
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/MaceGuard/pull-requests/14/issues?status=new&limit=1000'
          for attempt in $(seq 1 20); do
            curl --fail --silent --show-error --location \
              --header 'Accept: application/json' \
              "$url" \
              --output codacy-pr14-final.json
            analyzed=$(jq -r '.analyzed // false' codacy-pr14-final.json)
            total=$(jq -r '.pagination.total // (.data | length) // 0' codacy-pr14-final.json)
            echo "attempt=$attempt analyzed=$analyzed total=$total"
            if [[ "$analyzed" == "true" && "$total" -eq 3 ]]; then
              break
            fi
            sleep 15
          done
          jq -e '.analyzed == true' codacy-pr14-final.json >/dev/null
          jq -e '(.pagination.total // (.data | length)) == 3' codacy-pr14-final.json >/dev/null
          jq -r '.data[] | [
            (.commitIssue.toolInfo.name // ""),
            (.commitIssue.patternInfo.id // ""),
            (.commitIssue.patternInfo.severityLevel // .commitIssue.patternInfo.level // ""),
            (.commitIssue.patternInfo.category // ""),
            (.commitIssue.filePath // ""),
            ((.commitIssue.lineNumber // 0) | tostring),
            (.commitIssue.message // .commitIssue.patternInfo.title // "")
          ] | @tsv' codacy-pr14-final.json | sort > codacy-pr14-final.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: codacy-pr14-final-issues
          path: |
            codacy-pr14-final.json
            codacy-pr14-final.tsv
          if-no-files-found: error
          retention-days: 1

  publish-latest:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MaceGuard
          path: dist
      - name: Publish latest automated build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest dist/MaceGuard.jar --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --title "Latest automated build" --prerelease --target "$GITHUB_SHA" --notes "Automatically updated from main." --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest dist/MaceGuard.jar --title "Latest automated build" --prerelease --target "$GITHUB_SHA" --notes "Automatically updated from main." --repo "$GITHUB_REPOSITORY"
          fi
