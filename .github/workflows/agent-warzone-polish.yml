name: Agent Warzone GUI Polish

on:
  push:
    branches: [agent/warzone-gui-overhaul]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warzone-gui-overhaul
          fetch-depth: 0
      - name: Apply final GUI summary polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main/java/com/lincoln/maceguard/warzone/gui/WarzoneGuiManager.java')
          lines = path.read_text().splitlines(keepends=True)

          marker = '} else if (active.activeSet().description() != null && !active.activeSet().description().isBlank()) {'
          matches = [index for index, line in enumerate(lines) if marker in line]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one generated-description branch, found {len(matches)}')

          index = matches[0]
          indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
          if index + 2 >= len(lines) or 'selectionLore.add("<gray>" + active.activeSet().description())' not in lines[index + 1]:
              raise SystemExit('Generated-description branch shape changed unexpectedly')
          if lines[index + 2].strip() != '}':
              raise SystemExit('Generated-description branch closing brace changed unexpectedly')

          lines[index:index + 3] = [indent + '}\n']
          text = ''.join(lines)
          text = text.replace('    private static final String MUTED = "<dark_gray>";\n', '', 1)
          path.write_text(text)
          PY
      - name: Commit source polish and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-warzone-polish.yml
          git add src/main/java/com/lincoln/maceguard/warzone/gui/WarzoneGuiManager.java
          git commit -m "Polish Warzone GUI summaries"
          git push origin HEAD:agent/warzone-gui-overhaul
