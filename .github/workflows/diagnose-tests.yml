name: Capture failing Surefire reports

on:
  push:
    branches: [agent/weekly-warzone-modifiers]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[surefire-captured]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-warzone-modifiers
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run tests and capture reports
        shell: bash
        run: |
          set +e
          ./mvnw -B clean test
          status=$?
          set -e
          rm -rf .ci-diagnostics
          mkdir -p .ci-diagnostics
          if [ -d target/surefire-reports ]; then
            cp target/surefire-reports/*.txt .ci-diagnostics/ 2>/dev/null || true
            cp target/surefire-reports/TEST-*.xml .ci-diagnostics/ 2>/dev/null || true
          fi
          printf 'maven_status=%s\n' "$status" > .ci-diagnostics/status.txt
          rm -f .github/workflows/diagnose-tests.yml
          git add -A .ci-diagnostics .github/workflows/diagnose-tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Capture Surefire diagnostics [surefire-captured]'
          git push origin HEAD:agent/weekly-warzone-modifiers
