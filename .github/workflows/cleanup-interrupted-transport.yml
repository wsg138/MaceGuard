name: Clean interrupted transport artifacts

on:
  push:
    branches: [agent/weekly-warzone-modifiers]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[transport-clean]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/weekly-warzone-modifiers
          fetch-depth: 0
      - name: Remove temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf .maceguard-repair .maceguard-bundle .maceguard-complete
          rm -f .github/workflows/apply-maceguard-bundle.yml
          rm -f .github/workflows/apply-interrupted-bundle.yml
          rm -f .github/workflows/cleanup-interrupted-transport.yml
          git checkout origin/main -- .github/workflows/build.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove interrupted transport artifacts [transport-clean]'
          git push origin HEAD:agent/weekly-warzone-modifiers
