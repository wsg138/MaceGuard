name: MaceGuard
main: com.lincoln.maceguard.MaceGuardPlugin
version: 4.0.1
api-version: '1.21'
author: P2wn
description: WorldGuard-scoped warzone rotations, combat restrictions, temporary cobwebs, explosive controls, and safe resets.
depend: [WorldGuard]
softdepend: [PlaceholderAPI]

commands:
  maceguard:
    description: MaceGuard admin command
    usage: /<command> here|status|capture|validate|plan|arm|disarm|filler|restore|schedule|reset|recover|temporary|reload
  warzone:
    description: View or administer the integrated warzone rotation.
    aliases: [warzonerotator, wzr]
    usage: /<command> [info|items|next|skip|force|set|extend|reload|validate|debug]

permissions:
  maceguard.admin:
    default: op
  maceguard.reload:
    default: op
  maceguard.reset:
    default: op
  warzonerotator.admin:
    description: Grants all integrated warzone administrative permissions.
    default: op
    children:
      warzonerotator.command.info: true
      warzonerotator.command.items: true
      warzonerotator.command.next: true
      warzonerotator.command.skip: true
      warzonerotator.command.force: true
      warzonerotator.command.set: true
      warzonerotator.command.extend: true
      warzonerotator.command.reload: true
      warzonerotator.command.validate: true
      warzonerotator.command.debug: true
      warzonerotator.bypass: true
  warzonerotator.command.info: { default: true }
  warzonerotator.command.items: { default: true }
  warzonerotator.command.next: { default: true }
  warzonerotator.command.skip: { default: op }
  warzonerotator.command.force: { default: op }
  warzonerotator.command.set: { default: op }
  warzonerotator.command.extend: { default: op }
  warzonerotator.command.reload: { default: op }
  warzonerotator.command.validate: { default: op }
  warzonerotator.command.debug: { default: op }
  warzonerotator.bypass: { default: false }
