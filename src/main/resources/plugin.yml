name: MaceGuard
main: com.lincoln.maceguard.MaceGuardPlugin
version: 2.4.0-beta.1
api-version: '1.21'
author: P2wn
description: Zone protections, manual snapshot resets, End access controls, and End island combat/explosion restrictions.
softdepend: [WarzoneDuels]

commands:
  maceguard:
    description: MaceGuard admin command
    usage: /<command> reload|debug|stats|here|clear [zone]|snapshot <zone>|reset <zone>|endeyes <on|off|at time>|endportal <on|off|at time>|endstatus
    permission: maceguard.reload

permissions:
  maceguard.reload:
    default: op
  maceguard.edit:
    default: op
  maceguard.permanent-edit:
    description: Keeps staff edits out of the warzone sparse baseline.
    default: op
