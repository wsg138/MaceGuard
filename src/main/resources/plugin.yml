name: MaceGuard
main: com.lincoln.maceguard.MaceGuardPlugin
version: 3.0.0
api-version: '1.21'
author: P2wn
description: WorldGuard-scoped mace durability, temporary cobwebs, safe resets, and End controls.
depend: [WorldGuard]
softdepend: [WarzoneRotator]

commands:
  maceguard:
    description: MaceGuard admin command
    usage: /<command> here|status|capture|validate|plan|arm|disarm|reset|recover|temporary|reload|endeyes|endportal|endstatus

permissions:
  maceguard.admin:
    default: op
  maceguard.reload:
    default: op
  maceguard.reset:
    default: op
