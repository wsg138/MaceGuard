name: MaceGuard
main: com.lincoln.maceguard.MaceGuardPlugin
version: 6.1.5
api-version: '1.21'
author: P2wn
description: WorldGuard-scoped Warzone kits, repeating schedules, manual overrides, combat restrictions, temporary cobwebs, and safe region resets.
depend: [WorldGuard]
softdepend: [PlaceholderAPI, CombatLogX]

commands:
  maceguard:
    description: MaceGuard admin command
    usage: /<command> here|status|capture|validate|plan|arm|disarm|schedule|reset|recover|temporary|reload
  maceguardpearltrace:
    description: Temporarily trace Ender Pearl launch, hit, and teleport ordering for staging.
    usage: /<command> <on|off|show> <player>
    permission: warzonerotator.command.debug
  warzone:
    description: View or administer Warzone kits, modifiers, schedules, and overrides.
    aliases: [warzonerotator, wzr]
    usage: /<command> [info|modifiers|modifier|kit|kits|items|next|schedule|menu|help|random|override|reload|validate|debug]

permissions:
  maceguard.admin: { default: op }
  maceguard.reload: { default: op }
  maceguard.reset: { default: op }
  maceguard.block-policy.bypass:
    description: Bypasses player block-policy placement, breaking, and bucket rules.
    default: false
  maceguard.temporary-cobweb.bypass:
    description: Bypasses Warzone cobweb availability while retaining WorldGuard, block policies, tracking, and cleanup.
    default: false

  warzonerotator.admin:
    description: Grants all Warzone management permissions and compatibility commands.
    default: op
    children:
      warzonerotator.command.info: true
      warzonerotator.command.modifiers: true
      warzonerotator.command.kits: true
      warzonerotator.command.next: true
      warzonerotator.command.schedule: true
      warzonerotator.command.menu: true
      warzonerotator.command.items: true
      warzonerotator.manage.modifier: true
      warzonerotator.manage.kit: true
      warzonerotator.manage.random: true
      warzonerotator.manage.override: true
      warzonerotator.manage.schedule: true
      warzonerotator.manage.custom-combinations: true
      warzonerotator.command.skip: true
      warzonerotator.command.force: true
      warzonerotator.command.set: true
      warzonerotator.command.extend: true
      warzonerotator.command.reload: true
      warzonerotator.command.validate: true
      warzonerotator.command.debug: true
      warzonerotator.bypass: true

  warzonerotator.command.info: { default: true }
  warzonerotator.command.modifiers: { default: true }
  warzonerotator.command.kits: { default: true }
  warzonerotator.command.next: { default: true }
  warzonerotator.command.schedule: { default: true }
  warzonerotator.command.menu: { default: true }
  warzonerotator.command.items:
    default: true
    children:
      warzonerotator.command.modifiers: true

  warzonerotator.manage.modifier: { default: op }
  warzonerotator.manage.kit: { default: op }
  warzonerotator.manage.random: { default: op }
  warzonerotator.manage.override: { default: op }
  warzonerotator.manage.schedule: { default: op }
  warzonerotator.manage.custom-combinations: { default: op }

  warzonerotator.command.skip:
    default: op
    children: { warzonerotator.manage.random: true }
  warzonerotator.command.force:
    default: op
    children: { warzonerotator.manage.random: true }
  warzonerotator.command.set:
    default: op
    children:
      warzonerotator.manage.modifier: true
      warzonerotator.manage.custom-combinations: true
  warzonerotator.command.extend:
    default: op
    children: { warzonerotator.manage.override: true }
  warzonerotator.command.reload: { default: op }
  warzonerotator.command.validate: { default: op }
  warzonerotator.command.debug: { default: op }
  warzonerotator.bypass: { default: false }
