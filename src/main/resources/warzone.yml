# Weekly, calendar-based, composable warzone modifiers.
config-version: 4
enabled: true

region:
  world: world
  id: warzone
  excluded-region-ids:
    - spawn
    - market

rotation:
  schedule:
    day: SUNDAY
    time: "04:00"
    timezone: America/Indiana/Indianapolis
  selection:
    mode: RANDOM_MODIFIERS
    minimum: 1
    maximum: 3
    prevent-identical-repeat: true
  warning-times:
    - 1h
    - 30m
    - 10m
    - 5m
    - 1m

messages:
  blocked-message-cooldown: 2s
  warning-audience: global
  transition-audience: global

cobwebs:
  clear-after: 60s
  clear-on-meta-change: true
  clear-on-disable: true

# A modifier may only use restriction modes explicitly enabled here.
restriction-targets:
  MACE:
    can-disable: true
    can-cooldown: true
    maximum-cooldown: 60s
  SPEAR_LUNGE:
    can-disable: true
    can-cooldown: false
  COBWEB:
    can-disable: false
    can-cooldown: false

conflict-groups:
  mace-mode:
    - mace-disabled
    - mace-cooldown

modifiers:
  cobwebs:
    display-name: "<white>Cobwebs"
    description: "<gray>Temporary cobweb placement is available in the effective warzone."
    effects:
      - COBWEBS
    restrictions: {}
    start-message: "<white>Cobwebs are active in the warzone this week."
    end-message: "<gray>The weekly warzone cobweb modifier has ended."

  no-lunge:
    display-name: "<red>No Lunge"
    description: "<gray>The Spear Lunge effect is disabled without blocking normal spear use."
    effects: []
    restrictions:
      SPEAR_LUNGE:
        mode: DISABLED
    start-message: "<red>Spear Lunge is disabled in the warzone this week."

  mace-disabled:
    display-name: "<dark_red>No Maces"
    description: "<gray>Mace use is disabled in the effective warzone."
    effects: []
    restrictions:
      MACE:
        mode: DISABLED
    start-message: "<dark_red>Maces are disabled in the warzone this week."

  mace-cooldown:
    display-name: "<gold>Mace Cooldown"
    description: "<gray>Successful mace attacks receive a ten-second cooldown."
    effects: []
    restrictions:
      MACE:
        mode: COOLDOWN
        cooldown: 10s
    start-message: "<gold>Successful mace attacks now have a ten-second warzone cooldown."

  elytra-no-rockets:
    display-name: "<aqua>Elytra, No Rockets"
    description: "<gray>Elytra gliding is allowed, but actual firework boosting is blocked."
    effects:
      - ELYTRA_NO_ROCKETS
    restrictions: {}
    start-message: "<aqua>Elytra gliding is active in the warzone this week; rocket boosting is disabled."
