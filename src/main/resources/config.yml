config-version: 7
enabled: true
debug: false

mace-durability:
  damage-per-armor-piece: 2

temporary-blocks:
  cobweb-ttl-seconds: 60
  allowed-replacement-materials: [AIR, GRASS, TALL_GRASS, VINE, SNOW]
  max-tracked-blocks: 10000

performance:
  capture-batch-size: 2000
  plan-batch-size: 4000
  restore-batch-size: 1000

storage:
  fsync: true

# Regions and coordinates belong exclusively to WorldGuard. Profiles are inert
# until a WorldGuard region references one, a baseline is captured, and an
# administrator explicitly arms that exact region geometry.
reset-profiles: {}

end_island:
  enabled: true
  island_radius: 1024
  block_maces: true
  block_spears: true
